

services:
  # --- Database Tier ---
  postgres:
    image: postgres:16-alpine
    container_name: database_tier
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecurepassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Backend Tier ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_tier
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://myuser:mysecurepassword@postgres:5432/mydb
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # --- Frontend Tier ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_tier
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge